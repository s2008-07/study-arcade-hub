<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="study_arcade_symbol.png" />
    <title>THE STYDY ARCADE</title>
    <style>
      table {
        color: navy;
        border: 5px dashed rgba(2, 9, 54, 0.512);
        margin-left: auto;
      }
      td {
        color: rgb(68, 65, 90);
        padding: 20px;
        text-align: left;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        position: relative;
        min-height: 100vh;
        background-color: #1a1b26;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("the_arcade_background.png");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        transform: translateZ(0);
        will-change: transform;
      }
      @media (max-width: 600px) {
        table {
          width: 100%;
        }
        td {
          box-sizing: border-box;
          padding: 12px;
        }
        h1 {
          font-size: 24px;
        }
        h2 {
          font-size: 16px;
        }
        body::before {
          background-size: contain;
          background-position: center top;
        }
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td><h1>THIS IS A STUDY ARCADE</h1></td>
      </tr>
      <tr>
        <td>
          <ul>
            <li>
              <h2>the problems you are suffereing towards studying please give to us</h2>
            </li>
            <li>
              <h2>the solutions you are thinking</h2>
            </li>
            <li>
              <h2>the things done now</h2>
            </li>
          </ul>
        </td>
      </tr>
    </table>
  </body>
</html>
